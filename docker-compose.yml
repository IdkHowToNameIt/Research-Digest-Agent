# Orchestrazione: separazione backend (generatore Python) / frontend (nginx statico).
#
#   export GROQ_API_KEY=...
#   export DIGEST_RECIPIENTS=tu@example.com     # obbligatoria (anche solo il tuo indirizzo)
#   docker compose up --build        # genera i dati del sito e lo serve su http://localhost:8080
#
# In alternativa alle export: un file .env accanto a questo compose (vedi .env.example),
# che docker compose legge da solo.
#
# Il sito è statico per progetto (sez. 18: no login, no stato server, badge lato
# client): non serve un backend web dinamico. Il generatore (backend) scrive
# data.json + index.html in un volume condiviso; nginx li serve.

services:
  # Backend: esegue la pipeline una volta e termina (batch settimanale).
  generator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: dra-generator
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DIGEST_RECIPIENTS: ${DIGEST_RECIPIENTS:-}
      INTERNAL_NOTES_RECIPIENTS: ${INTERNAL_NOTES_RECIPIENTS:-}
      # Senza, si ricade sul placeholder di config.yaml e il run si ferma.
      HOMEPAGE_URL: ${HOMEPAGE_URL:-http://localhost:8080}
      # SMTP assente = le email restano stampate a log (nessun invio reale).
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - sito:/app/sito               # output HTML del sito (condiviso con nginx)
      - data:/app/backend/data       # storico dedup + archivio digest pubblici (persistente)

  # Frontend: web server statico. Parte solo dopo che il generatore ha finito.
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - sito:/usr/share/nginx/html:ro
    depends_on:
      generator:
        condition: service_completed_successfully

  # Anteprima dell'interfaccia senza rigenerare il digest: serve la build del
  # frontend da sola. NB: legge data.json, che qui non c'è (nessun dato) -> mostra
  # la sola shell. Per il sito con i dati reali usare il servizio `web`.
  #   cd frontend && npm run build      (la build NON è nel repo: è gitignored)
  #   docker compose up anteprima  ->  http://localhost:8082
  anteprima:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  sito:
  data:
