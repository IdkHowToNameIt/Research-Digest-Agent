# Config DEMO offline: usa feed locali fittizi (nessuna rete, nessuna API key).
# Serve alla modalità --demo e al container Docker di test.
beat: "Infrastruttura & Hardware AI (demo)"
beat_slug: "infra-hardware-ai-demo"
model: "gemini-2.5-flash"

db_path: "data/seen.sqlite3"
out_dir: "out"

soglia_overlap_dedup: 0.7
finestra_dedup_settimane: 6

sito:
  homepage_url: "http://localhost:8080"
  out_dir: "sito"
  archivio_dir: "data/archivio"
  badge_giorni: 2

email:
  destinatari_digest: ["team@example.com"]
  destinatari_note_interne: ["it@example.com"]

fonti:
  - nome: "Demo Chip"
    url: "sample-output/demo-chip.xml"
    tema: chip
    max: 10
    troncamento: 500
  - nome: "Demo Energia (arXiv)"
    url: "sample-output/demo-energia.xml"
    tema: energia
    max: 10
    troncamento: null        # arXiv: nessun troncamento (sez. 13)
  - nome: "Demo Cloud"
    url: "sample-output/demo-cloud.xml"
    tema: cloud_capacity
    max: 10
    troncamento: 500
