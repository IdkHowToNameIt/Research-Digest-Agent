<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRA — concept</title>
<!--
  Interfaccia web del Digest Research Agent (tema scuro, accento rosa). Identità
  visiva: font Poppins, sfondo con gli 8 simboli reali di kakashi.ventures disposti
  sparsi su canvas, che si accendono di rosso vicino al cursore, logo reale
  kakashi.ventures (kva-logo.webp, reso chiaro sul tema scuro) e titolo in gradiente.

  Codice separato in tre file accanto a questo:
    stile.css   — tutto lo stile
    app.js      — logica: legge data.json e genera home/cronologia/articolo
    sfondo.js   — effetto canvas dei glifi (con i PNG incorporati in base64)
  Il backend copia tutti questi file nella publish-dir (src/consegna/sito.py).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="grad" aria-hidden="true"></div>

  <header>
    <a class="logo" href="#" onclick="vaiHome();return false" title="Digest Research Agent (DRA)">
      <span class="mark" aria-hidden="true">
        <img class="mark-img" src="kva-logo.webp" alt="kakashi.ventures" width="48" height="38">
      </span>
      <span class="wm">DRA</span>
    </a>
    <nav class="topnav">
      <a class="topnav-link" href="#" onclick="vaiDashboard();return false" title="Sotto il cofano — i numeri dell'agente">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0"/><line x1="12" y1="17" x2="16.5" y2="11.5"/><circle cx="12" cy="17" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>Sotto il cofano</span>
      </a>
    </nav>
  </header>

  <div id="app"></div>

<script src="app.js" defer></script>

<script src="sfondo.js" defer></script>
</body>
</html>
