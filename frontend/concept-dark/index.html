<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRA — concept (dark)</title>
<!--
  Concept "dark" del Digest Research Agent.
  STESSE funzionalità e impostazioni della bozza chiara (design/bozza-homepage.html):
  stessi dati (offset/sintesi/perche/nota), stesse soglie (nuovo <=2 giorni, settimana
  <=7 giorni), homepage con box solo per i temi aggiornati, cronologia per tema con
  "Nuovo aggiornamento" calcolato lato client, vista articolo con "Perché conta".
  L'unica differenza è il DESIGN (tema scuro, accento rosa/rosso, card glass, Poppins,
  effetti canvas: glow LED sul cursore + gocce d'acqua). HTML/CSS/JS vanilla autonomo:
  framework custom e asset del concept originale sostituiti (sfondo generato, logo placeholder).
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  :root{
    --accent:#e0506e; --accent-h:#f0899c;
    --bg:#07080a; --ink:#e7e9ec;
    --font:'Poppins','Century Gothic',Futura,'Segoe UI',system-ui,Roboto,sans-serif;
  }
  body{min-height:100vh;background:var(--bg) center center / cover no-repeat fixed;
    color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-h)}
  @keyframes kvaFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:
    linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 14%,rgba(0,0,0,0) 32%),
    radial-gradient(120% 90% at 50% -10%,rgba(46,20,26,.4) 0%,rgba(7,8,10,0) 45%),
    radial-gradient(140% 120% at 50% 120%,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 55%);}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:52px 28px 88px}

  /* header */
  .hdr{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:14px;margin-bottom:52px;min-height:56px}
  .logo{position:absolute;right:0;top:-6px;display:inline-flex;align-items:flex-end;gap:3px;cursor:pointer;background:none;border:0}
  .logo .mark{height:52px;width:52px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--accent),#7a1330);box-shadow:0 0 22px rgba(224,80,110,.35)}
  .logo .mark svg{width:30px;height:30px}
  .logo .dra{font-weight:600;font-size:12px;line-height:1;color:#c4c8cc;letter-spacing:.06em;margin-bottom:3px}
  .htitle{display:inline-flex;align-items:baseline;gap:11px}
  .htitle span{font-size:26px;font-weight:600;letter-spacing:.01em;color:#f0f2f4}
  .weekline{display:inline-flex;align-items:center;gap:10px;font-size:12px;color:#5c646d}
  .weekdot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(224,80,110,.9)}

  /* nav 5 temi */
  .cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:56px}
  .cat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:22px 14px;background:rgba(18,18,20,.86);border:1px solid rgba(255,255,255,.1);border-radius:14px;
    color:#c3c6ca;cursor:pointer;font-family:var(--font);font-size:14.5px;font-weight:500;letter-spacing:.01em;transition:all .18s ease}
  .cat-btn svg{width:24px;height:24px}
  .cat-btn:hover{border-color:rgba(224,80,110,.75);background:rgba(224,80,110,.07);color:#fff;
    box-shadow:0 0 0 1px rgba(224,80,110,.45),0 10px 34px rgba(224,80,110,.14);transform:translateY(-3px)}

  /* sezione settimanale */
  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .sec-head h2{margin:0;font-weight:600;font-size:19px;letter-spacing:-.01em;color:#e9ebee}
  .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,0))}
  .sec-note{font-size:12.5px;color:#6b737b;margin:0 0 22px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:18px;align-items:start}
  .card{display:flex;flex-direction:column;background:rgba(18,18,20,.86);border:1px solid rgba(255,255,255,.09);
    border-radius:16px;padding:20px 20px 16px;transition:border-color .18s ease,box-shadow .18s ease}
  .card:hover{border-color:rgba(224,80,110,.35);box-shadow:0 14px 44px rgba(0,0,0,.45)}
  .card-label{display:flex;align-items:center;gap:9px;margin-bottom:6px;color:var(--accent)}
  .card-label svg{width:15px;height:15px}
  .card-label span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
  .art-btn{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(255,255,255,.07);
    padding:13px 0;color:#c4c7cb;font-family:var(--font);font-size:15px;line-height:1.4;cursor:pointer;
    transition:color .15s ease,padding-left .15s ease}
  .art-btn:hover{color:var(--accent-h);padding-left:6px}
  .art-sub{display:block;font-size:11.5px;color:#6f7780;margin-top:4px}
  .card-open{display:inline-block;margin-top:14px;font-size:12px;color:var(--accent);font-weight:500;cursor:pointer;background:none;border:0;padding:0;font-family:var(--font)}
  .card-open:hover{color:var(--accent-h)}

  /* barra vista secondaria */
  .catbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
  .back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:#8b939c;cursor:pointer;
    font-family:var(--font);font-size:12px;letter-spacing:.04em;transition:color .15s ease}
  .back:hover{color:var(--accent-h)}
  .back svg{width:15px;height:15px}
  .logo-sm{display:inline-flex;align-items:flex-end;gap:3px;background:none;border:0;cursor:pointer}
  .logo-sm .mark{height:26px;width:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent),#7a1330)}
  .logo-sm .mark svg{width:16px;height:16px}
  .logo-sm .dra{font-weight:600;font-size:11px;color:#aeb4ba;margin-left:1px;margin-bottom:1px;letter-spacing:.06em}

  /* cronologia tema */
  .crono h1{margin:0 0 6px;font-weight:600;font-size:38px;line-height:1.05;letter-spacing:-.02em;color:#f2f4f6}
  .crono .kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .crono-sub{color:#6b737b;font-size:13px;margin:0 0 26px}
  .nuovo-label{display:flex;align-items:center;gap:.7rem;margin:0 0 6px;color:var(--accent);font-weight:600;
    letter-spacing:.14em;font-size:11px;text-transform:uppercase}
  .nuovo-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(224,80,110,.55),transparent)}
  .voce{background:rgba(18,18,20,.86);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px 18px;
    margin:10px 0;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s}
  .voce:hover{border-color:rgba(224,80,110,.4);box-shadow:0 14px 40px rgba(0,0,0,.45);transform:translateY(-2px)}
  .voce .meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:#7c8894;margin-bottom:6px}
  .voce .meta .src{color:var(--accent-h);font-weight:500}
  .badge-nuovo{background:var(--accent);color:#fff;font-size:9.5px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;border-radius:999px;padding:2px 8px}
  .voce h4{margin:0 0 5px;font-weight:600;font-size:16.5px;line-height:1.3;color:#e9ebee}
  .voce .excerpt{font-size:13px;color:#9aa0a6;line-height:1.45}
  .divisore{border:0;border-top:1px dashed rgba(255,255,255,.12);margin:22px 0}

  /* vista articolo */
  .article-wrap{max-width:760px}
  .article-wrap h1{margin:8px 0 0;font-weight:600;font-size:30px;line-height:1.18;letter-spacing:-.01em;color:#f2f4f6}
  .art-meta{display:flex;align-items:center;gap:12px;margin:14px 0 4px;font-size:12px;color:#7c8894}
  .art-meta .src{color:var(--accent-h);font-weight:500}
  .art-meta .sep{width:3px;height:3px;border-radius:50%;background:#4a545e}
  .nota{color:#8b939c;font-style:italic;font-size:12.5px;margin:8px 0 0}
  .article-wrap p.body{margin:20px 0 0;font-size:17px;line-height:1.75;color:#c2c6cc;max-width:70ch}
  .perche{background:rgba(224,80,110,.07);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;
    padding:16px 18px;margin-top:26px;color:#d0d4d9;font-size:15px;line-height:1.65;max-width:72ch}
  .perche strong{color:#f0f2f4}

  .fade{animation:kvaFade .4s ease both}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
  <div class="vignette"></div>
  <canvas id="fx"></canvas>
  <div class="wrap" id="app"></div>

<script>
/* =========================================================================
   DATI + IMPOSTAZIONI — identici alla bozza chiara (solo il design differisce)
   ========================================================================= */
const TEMI = [
  {id:"chip", nome:"Chip", kicker:"Semiconduttori", articoli:[
    {titolo:"NVIDIA presenta l'acceleratore Blackwell Ultra (GB300) per l'addestramento su larga scala",
     fonte:"NVIDIA Newsroom", offset:1,
     sintesi:"NVIDIA ha presentato il GB300, evoluzione della piattaforma Blackwell orientata ai cluster di addestramento più grandi. L'azienda dichiara una banda GPU-to-GPU di 3,2 Tbps e una dotazione di memoria HBM3e ampliata rispetto alla generazione precedente. Il posizionamento è esplicitamente sui carichi di addestramento su scala, dove l'interconnessione è spesso il vero collo di bottiglia. Restano da verificare in campo i consumi effettivi e le tempistiche di disponibilità dichiarate.",
     perche:"La banda di interconnessione, più della potenza del singolo chip, determina la scalabilità reale dei cluster: è il parametro che pesa sui costi infrastrutturali di chi addestra modelli."},
    {titolo:"AMD amplia la linea Instinct MI350 puntando sull'efficienza energetica",
     fonte:"Tom's Hardware", offset:3,
     sintesi:"AMD ha ampliato la famiglia Instinct MI350, con un messaggio centrato sull'efficienza energetica per watt più che sul picco di prestazioni. La società indica un miglioramento rispetto a MI300 e una disponibilità collocata nella seconda metà dell'anno. La mossa consolida la posizione di AMD come alternativa credibile nel segmento degli acceleratori per data center.",
     perche:"Un secondo fornitore competitivo riduce la dipendenza da un unico attore e influenza i prezzi degli acceleratori, voce di costo dominante nell'infrastruttura AI."},
    {titolo:"TSMC conferma l'avvio della produzione a 2 nm per i primi clienti",
     fonte:"Tom's Hardware", offset:6,
     sintesi:"TSMC ha confermato l'ingresso in produzione del nodo a 2 nm per i primi clienti, con rese descritte come in linea con le attese. Il nodo introduce transistor a nanofoglio e promette guadagni di efficienza rilevanti per i chip AI di prossima generazione. La capacità iniziale resta limitata e allocata ai clienti principali.",
     perche:"L'accesso anticipato ai nodi più avanzati è un vantaggio competitivo: chi non è in cima alla lista di allocazione rischia di restare indietro di un'intera generazione."}
  ]},
  {id:"energia", nome:"Energia", kicker:"Power & Grid", articoli:[
    {titolo:"Studio: lo scheduling dei carichi può ridurre il consumo dei data center del 15-20%",
     fonte:"arXiv", offset:10, nota:"(preprint, non ancora sottoposto a peer review)",
     sintesi:"I risultati preliminari di uno studio indicano che una strategia di scheduling dei carichi di lavoro può ridurre il consumo energetico dei data center del 15-20% in scenari specifici, senza degradare le prestazioni di inferenza. Gli autori misurano l'effetto su un cluster simulato con carichi misti addestramento/inferenza. Viene discusso il limite della generalizzazione ad ambienti di produzione reali.",
     perche:"L'energia è il vincolo strutturale della crescita AI: ogni punto percentuale di efficienza si traduce in capacità aggiuntiva a parità di rete elettrica disponibile."},
    {titolo:"Analisi sui limiti di rete elettrica per i nuovi campus di data center",
     fonte:"arXiv", offset:26, nota:"(preprint, non ancora sottoposto a peer review)",
     sintesi:"I risultati preliminari di uno studio indicano che la disponibilità di allacciamento alla rete elettrica, e non il terreno o il capitale, sta diventando il fattore limitante per i nuovi campus di data center in diverse aree. Il lavoro mappa i tempi di attesa per la connessione in alcune regioni.",
     perche:"Sposta l'attenzione dal capex alla disponibilità fisica di potenza: un tema centrale per chi pianifica capacità a 3-5 anni."}
  ]},
  {id:"data_center", nome:"Data center", kicker:"Infrastruttura", articoli:[
    {titolo:"Meta descrive il raffreddamento a liquido diretto nei nuovi cluster di training",
     fonte:"Meta Engineering", offset:2,
     sintesi:"Meta ha descritto l'adozione del raffreddamento a liquido diretto-a-chip nei nuovi cluster dedicati all'addestramento. L'azienda riporta densità di potenza per rack più elevate e un impatto favorevole sull'efficienza complessiva. Vengono illustrate le implicazioni impiantistiche, dalla distribuzione idraulica al recupero di calore.",
     perche:"La densità per rack è ciò che permette di concentrare più calcolo nello stesso spazio e nella stessa fornitura elettrica: abilita la scala senza moltiplicare gli edifici."},
    {titolo:"Uptime Institute: l'indisponibilità media cala, ma il costo degli outage cresce",
     fonte:"Uptime Institute Journal", offset:9,
     sintesi:"Secondo l'ultimo rapporto dell'Uptime Institute, la frequenza degli outage gravi è in calo, mentre il loro costo economico medio continua a salire. L'analisi lega il fenomeno alla crescente concentrazione di carichi critici. Vengono indicate le cause ricorrenti, con il fattore umano ancora prominente.",
     perche:"Per chi investe in infrastruttura, l'affidabilità è un costo nascosto: outage più rari ma più costosi cambiano il calcolo del rischio."}
  ]},
  {id:"supply_chain", nome:"Supply chain", kicker:"Logistica & Materiali", articoli:[
    {titolo:"Nuove restrizioni all'export di apparecchiature per semiconduttori verso più paesi",
     fonte:"Federal Register — BIS", offset:1,
     sintesi:"Il Bureau of Industry and Security ha pubblicato nuove restrizioni all'export di apparecchiature per la produzione di semiconduttori, estendendo l'elenco dei paesi interessati. Il provvedimento aggiorna soglie e categorie tecniche rispetto alle regole precedenti. Gli operatori del settore avranno una finestra per l'adeguamento.",
     perche:"Le regole sull'export ridisegnano le catene di fornitura globali e possono spostare investimenti e capacità produttiva tra regioni nel giro di pochi trimestri."},
    {titolo:"ASML: ordini in ripresa, focus sulla litografia EUV High-NA",
     fonte:"Google News (TSMC/ASML)", offset:5, nota:"ripreso da più testate",
     sintesi:"Diverse testate riportano una ripresa degli ordini per ASML, trainata dalla domanda per la litografia EUV di nuova generazione High-NA. Le consegne dei primi sistemi ai clienti principali sono descritte come in accelerazione. Restano incertezze sui tempi di industrializzazione presso le fab.",
     perche:"ASML è un punto di strozzatura unico nella filiera: la cadenza delle sue consegne condiziona di fatto il ritmo di espansione della capacità mondiale di chip avanzati."}
  ]},
  {id:"cloud_capacity", nome:"Cloud", kicker:"Piattaforme & Servizi", articoli:[
    {titolo:"Google Cloud annuncia una nuova regione con capex dichiarato da 2 miliardi di dollari",
     fonte:"Google Cloud — Infrastructure", offset:1,
     sintesi:"Google Cloud ha annunciato una nuova regione cloud con un capex dichiarato di 2 miliardi di dollari, più zone di disponibilità e un cavo sottomarino dedicato per la ridondanza. L'obiettivo comunicato è aumentare la capacità e la resilienza in un'area a forte domanda. La messa in servizio è prevista in fasi.",
     perche:"Le cifre di investimento dichiarate e la ridondanza fisica sono indicatori concreti di dove i grandi provider stanno spostando capacità di calcolo."},
    {titolo:"AWS espande la capacità con nuove zone e infrastruttura di rete",
     fonte:"AWS News Blog", offset:4,
     sintesi:"AWS ha comunicato l'espansione della propria capacità con nuove zone di disponibilità e potenziamenti dell'infrastruttura di rete. Il messaggio, ripulito dal linguaggio promozionale, contiene riferimenti a capacità aggiuntiva e a miglioramenti di latenza. Le tempistiche di rilascio sono scaglionate per area.",
     perche:"La distribuzione geografica della capacità cloud determina dove è possibile eseguire carichi AI vicino ai dati e agli utenti, con impatto diretto su costi e latenza."}
  ]}
];

const SOGLIA_NUOVO = 2;      // giorni: badge "Nuovo aggiornamento" (calcolo lato client)
const SOGLIA_SETTIMANA = 7;  // giorni: rientra nel digest "di questa settimana"
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];

const dataDa = off => new Date(Date.now() - off*86400000);
const formatta = d => d.getDate()+" "+MESI[d.getMonth()]+" "+d.getFullYear();
const trovaTema = id => TEMI.find(t => t.id === id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const ICON_ATTR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  chip:'<svg '+ICON_ATTR+'><rect x="7" y="7" width="10" height="10" rx="1.5"/><rect x="10" y="10" width="4" height="4" rx="0.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg>',
  energia:'<svg '+ICON_ATTR+'><path d="M13 2 L5 13.5 h6 l-1 8.5 9-12.5 h-6 z"/></svg>',
  data_center:'<svg '+ICON_ATTR+'><rect x="4" y="4" width="16" height="5" rx="1.2"/><rect x="4" y="10.5" width="16" height="5" rx="1.2"/><rect x="4" y="17" width="16" height="3" rx="1.2"/><path d="M7 6.5h.01M7 13h.01"/></svg>',
  supply_chain:'<svg '+ICON_ATTR+'><rect x="2.5" y="9" width="7" height="6" rx="1"/><rect x="14.5" y="9" width="7" height="6" rx="1"/><path d="M9.5 12h5"/><path d="M12.5 10.5 14.5 12l-2 1.5"/></svg>',
  cloud_capacity:'<svg '+ICON_ATTR+'><path d="M6.5 18 A4 4 0 0 1 6 10.1 A5.2 5.2 0 0 1 16 8.5 A3.7 3.7 0 0 1 17.5 18 z"/></svg>'
};
const LOGO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#ffdfe6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h6a8 8 0 0 1 0 16H5z"/><path d="M9 9h2a3 3 0 0 1 0 6H9z" fill="#ffdfe6" stroke="none" opacity=".9"/></svg>';

const app = document.getElementById('app');

/* =========================================================================
   VISTE (stessa logica della bozza chiara)
   ========================================================================= */
/* ---------- HOMEPAGE: box solo per i temi con aggiornamenti della settimana ---------- */
function vaiHome(){
  const conAgg = TEMI.filter(t => t.articoli.some(a => a.offset <= SOGLIA_SETTIMANA));
  const oggi = formatta(new Date());

  const nav = TEMI.map(t =>
    `<button class="cat-btn" onclick="vaiTema('${t.id}')">${ICONS[t.id]}<span>${t.nome}</span></button>`
  ).join('');

  const cards = conAgg.map(t => {
    const voci = t.articoli.filter(a => a.offset <= SOGLIA_SETTIMANA).map(a => {
      const idx = t.articoli.indexOf(a);
      return `<button class="art-btn" onclick="vaiArticolo('${t.id}',${idx})">${esc(a.titolo)}
        <small class="art-sub">${esc(a.fonte)} · ${formatta(dataDa(a.offset))}</small></button>`;
    }).join('');
    return `<div class="card">
        <div class="card-label">${ICONS[t.id]}<span>${t.nome}</span></div>
        ${voci}
        <button class="card-open" onclick="vaiTema('${t.id}')">Cronologia ${esc(t.nome)} →</button>
      </div>`;
  }).join('');

  app.innerHTML = `<div class="fade">
    <header class="hdr">
      <button class="logo" onclick="vaiHome()" title="Digest Research Agent">
        <span class="mark">${LOGO_SVG}</span><span class="dra">DRA</span>
      </button>
      <div class="htitle"><span>Digest</span><span>Research</span><span>Agent</span></div>
      <div class="weekline"><span class="weekdot"></span>Aggiornamento della settimana · ${oggi}</div>
    </header>
    <nav class="cats">${nav}</nav>
    <div class="sec-head"><h2>Aggiornamenti di questa settimana</h2><span class="rule"></span></div>
    <p class="sec-note">Compaiono solo i temi con novità nella settimana corrente.</p>
    <div class="grid">${cards}</div>
  </div>`;
}

/* ---------- CRONOLOGIA TEMA: recenti (<=2 giorni) sotto "Nuovo aggiornamento" ---------- */
function vaiTema(id){
  const t = trovaTema(id);
  const ordinati = t.articoli.map((a,i) => ({a,i})).sort((x,y) => x.a.offset - y.a.offset);
  const nuovi = ordinati.filter(o => o.a.offset <= SOGLIA_NUOVO);
  const vecchi = ordinati.filter(o => o.a.offset > SOGLIA_NUOVO);

  const voce = o => {
    const a = o.a, isNuovo = a.offset <= SOGLIA_NUOVO;
    return `<div class="voce" onclick="vaiArticolo('${id}',${o.i})">
        <div class="meta"><span class="src">${esc(a.fonte)}</span> · ${formatta(dataDa(a.offset))}
          ${isNuovo ? '<span class="badge-nuovo">Nuovo</span>' : ''}</div>
        <h4>${esc(a.titolo)}</h4>
        <div class="excerpt">${esc(a.sintesi.split('. ')[0])}.</div>
      </div>`;
  };

  let corpo = '';
  if(nuovi.length){ corpo += `<div class="nuovo-label">Nuovo aggiornamento</div>` + nuovi.map(voce).join('') + `<hr class="divisore">`; }
  corpo += vecchi.map(voce).join('') || (nuovi.length ? '' : `<p class="crono-sub">Nessun articolo in archivio per questo tema.</p>`);

  app.innerHTML = `<div class="fade">
    <div class="catbar">
      <button class="back" onclick="vaiHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        Tutte le categorie
      </button>
      <button class="logo-sm" onclick="vaiHome()" title="Home"><span class="mark">${LOGO_SVG}</span><span class="dra">DRA</span></button>
    </div>
    <div class="crono">
      <div class="kicker">${esc(t.kicker)}</div>
      <h1>${esc(t.nome)}</h1>
      <p class="crono-sub">Cronologia del tema</p>
      ${corpo}
    </div>
  </div>`;
  window.scrollTo({top:0});
}

/* ---------- ARTICOLO: sintesi completa + "Perché conta" ---------- */
function vaiArticolo(id,i){
  const t = trovaTema(id), a = t.articoli[i];
  app.innerHTML = `<div class="fade">
    <div class="catbar">
      <button class="back" onclick="vaiTema('${id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        ${esc(t.nome)}
      </button>
      <button class="logo-sm" onclick="vaiHome()" title="Home"><span class="mark">${LOGO_SVG}</span><span class="dra">DRA</span></button>
    </div>
    <div class="article-wrap">
      <div class="kicker" style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);">${esc(t.kicker)}</div>
      <h1>${esc(a.titolo)}</h1>
      <div class="art-meta"><span class="src">${esc(a.fonte)}</span><span class="sep"></span><span>${formatta(dataDa(a.offset))}</span></div>
      ${a.nota ? `<div class="nota">${esc(a.nota)}</div>` : ''}
      <p class="body">${esc(a.sintesi)}</p>
      <div class="perche"><strong>Perché conta:</strong> ${esc(a.perche)}</div>
    </div>
  </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

window.vaiHome = vaiHome; window.vaiTema = vaiTema; window.vaiArticolo = vaiArticolo;

/* =========================================================================
   SFONDO generato (sostituisce assets/bg.png) + EFFETTI CANVAS (design)
   ========================================================================= */
function makeBackground(){
  const w=1600,h=1000,c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  x.fillStyle='#07080a'; x.fillRect(0,0,w,h);
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const glyph=(gx,gy,s,tone)=>{
    x.save(); x.translate(gx,gy);
    x.strokeStyle='rgba('+tone+','+tone+','+(tone+6)+',0.9)';
    x.fillStyle='rgba('+tone+','+tone+','+(tone+6)+',0.9)';
    x.lineWidth=Math.max(1,s*0.06);
    const t=Math.floor(Math.random()*4);
    if(t===0){ x.strokeRect(-s/2,-s/2,s,s); x.strokeRect(-s/6,-s/6,s/3,s/3);
      for(let k=-1;k<=1;k++){x.beginPath();x.moveTo(k*s/4,-s/2);x.lineTo(k*s/4,-s/2-s*0.22);x.stroke();
        x.beginPath();x.moveTo(k*s/4,s/2);x.lineTo(k*s/4,s/2+s*0.22);x.stroke();} }
    else if(t===1){ x.beginPath();x.moveTo(-s/2,0);x.lineTo(s/2,0);x.moveTo(0,-s/2);x.lineTo(0,s/2);x.stroke(); }
    else if(t===2){ x.beginPath();x.arc(0,0,s*0.16,0,7);x.fill(); }
    else { x.beginPath();x.moveTo(-s/2,-s/4);x.lineTo(0,-s/4);x.lineTo(0,s/4);x.lineTo(s/2,s/4);x.stroke();
      x.beginPath();x.arc(-s/2,-s/4,s*0.06,0,7);x.fill();x.beginPath();x.arc(s/2,s/4,s*0.06,0,7);x.fill(); }
    x.restore();
  };
  const step=74;
  for(let gy=step; gy<h; gy+=step) for(let gx=step; gx<w; gx+=step){
    if(Math.random()<0.32) continue;
    glyph(gx+rnd(-14,14), gy+rnd(-14,14), rnd(16,30), Math.floor(rnd(46,96)));
  }
  return c;
}

function initFx(){
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  const bg=makeBackground(), bgW=bg.width, bgH=bg.height;
  document.body.style.backgroundImage='url('+bg.toDataURL()+')';
  let W=0,H=0,DPR=1;
  const resize=()=>{ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); };
  resize(); addEventListener('resize', resize);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  const mouse={x:-9999,y:-9999,tx:-9999,ty:-9999,active:false};
  addEventListener('mousemove', e=>{ mouse.tx=e.clientX; mouse.ty=e.clientY;
    if(!mouse.active){mouse.x=e.clientX;mouse.y=e.clientY;} mouse.active=true; });
  addEventListener('mouseout', e=>{ if(!e.relatedTarget) mouse.active=false; });
  const cover=()=>{ const s=Math.max(W/bgW,H/bgH); return {s,offX:(W-bgW*s)/2,offY:(H-bgH*s)/2}; };

  function glow(cx,cy){
    const R_GLOW=300,R_LED=190;
    const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,R_GLOW);
    halo.addColorStop(0,'rgba(160,10,40,0.42)'); halo.addColorStop(.5,'rgba(120,5,30,0.22)'); halo.addColorStop(1,'rgba(90,0,20,0)');
    ctx.fillStyle=halo; ctx.fillRect(cx-R_GLOW,cy-R_GLOW,R_GLOW*2,R_GLOW*2);
    const {s,offX,offY}=cover();
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R_LED,0,Math.PI*2); ctx.clip();
    const fade=ctx.createRadialGradient(cx,cy,0,cx,cy,R_LED);
    fade.addColorStop(0,'rgba(255,255,255,1)'); fade.addColorStop(.75,'rgba(255,255,255,0.6)'); fade.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalCompositeOperation='screen'; ctx.drawImage(bg,offX,offY,bgW*s,bgH*s);
    ctx.globalCompositeOperation='multiply';
    const col=ctx.createRadialGradient(cx,cy,0,cx,cy,R_LED);
    col.addColorStop(0,'rgb(255,214,224)'); col.addColorStop(.4,'rgb(255,110,135)'); col.addColorStop(1,'rgb(120,10,35)');
    ctx.fillStyle=col; ctx.fillRect(cx-R_LED,cy-R_LED,R_LED*2,R_LED*2);
    ctx.globalCompositeOperation='destination-in'; ctx.fillStyle=fade;
    ctx.beginPath(); ctx.arc(cx,cy,R_LED,0,Math.PI*2); ctx.fill();
    ctx.restore();
    const core=ctx.createRadialGradient(cx,cy,0,cx,cy,58);
    core.addColorStop(0,'rgba(255,225,232,0.34)'); core.addColorStop(.45,'rgba(255,100,128,0.16)'); core.addColorStop(1,'rgba(255,100,128,0)');
    ctx.fillStyle=core; ctx.fillRect(cx-58,cy-58,116,116);
  }
  function drawDrop(cx,cy,rad,zoom,alpha){
    const {s,offX,offY}=cover();
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.clip();
    ctx.globalAlpha=alpha; ctx.translate(cx,cy); ctx.scale(zoom,zoom); ctx.translate(-cx,-cy);
    ctx.drawImage(bg,offX,offY,bgW*s,bgH*s);
    ctx.setTransform(DPR,0,0,DPR,0,0); ctx.globalCompositeOperation='destination-in';
    const fade=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    fade.addColorStop(0,'rgba(255,255,255,1)'); fade.addColorStop(.7,'rgba(255,255,255,0.85)'); fade.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=fade; ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  const drops=[]; let nextDrop=performance.now()+900;
  function loop(){
    if(!cv.isConnected) return;
    ctx.clearRect(0,0,W,H);
    const now=performance.now();
    if(now>nextDrop){ drops.push({x:40+Math.random()*(W-80),y:40+Math.random()*(H-80),t:now});
      if(drops.length>7) drops.shift(); nextDrop=now+700+Math.random()*1100; }
    for(let i=drops.length-1;i>=0;i--){
      const d=drops[i], age=(now-d.t)/1000;
      if(age>1.8){ drops.splice(i,1); continue; }
      const p=age/1.8, ease=1-Math.pow(1-p,3);
      const rad=34+ease*150, zoom=1+0.38*(1-ease)+0.03*Math.sin(age*18)*(1-p);
      const alpha=p<0.12? p/0.12 : (1-(p-0.12)/0.88);
      drawDrop(d.x,d.y,rad,zoom,alpha);
    }
    mouse.x+=(mouse.tx-mouse.x)*0.5; mouse.y+=(mouse.ty-mouse.y)*0.5;
    if(mouse.active) glow(mouse.x,mouse.y);
    requestAnimationFrame(loop);
  }
  if(!reduce) requestAnimationFrame(loop);
}

/* avvio */
vaiHome();
initFx();
</script>
