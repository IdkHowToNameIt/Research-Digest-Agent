<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRA — concept (dark)</title>
<!--
  Concept "dark" del Digest Research Agent — riscrittura autonoma (vanilla JS) del
  concept KVAdra.dc.html. Il file originale era in formato ".dc" (framework proprietario
  <x-dc>/<sc-if>/<sc-for> + support.js) e dipendeva da asset mancanti (assets/bg.png,
  assets/logo-clean.svg). Qui tutto è self-contained: nessun JS/asset esterno, gira
  servito da nginx senza build (docker compose up concept -> http://localhost:8082).
  Lo sfondo a matrice di glifi e il logo sono generati/placeholder.

  Funzionalità allineate alla bozza chiara (frontend/bozza-homepage.html), mantenendo
  però lo stile dark: in home compaiono SOLO i temi con aggiornamenti nella settimana
  corrente, i box sono centrati dinamicamente come gruppo (autocentratura), e le date /
  il badge "Nuovo" sono calcolati lato client dall'offset in giorni (evergreen).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background-color: #07080a;
    color: #e7e9ec;
    font-family: 'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: #e0506e; text-decoration: none; }
  a:hover { color: #f0899c; }
  @keyframes kvaFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Hover states (nel concept .dc erano l'attributo style-hover del framework) */
  .navbtn:hover { color: #ffffff; }
  .menu-item:hover { background: rgba(255,255,255,0.05); }
  .src:hover { border-color: rgba(65,172,223,0.5); color: #8fd4f5; background: rgba(65,172,223,0.08); }
  .wcard:hover { border-color: rgba(224,80,110,0.35); box-shadow: 0 14px 44px rgba(0,0,0,0.45); }
  .witem:hover { color: #f0899c; padding-left: 6px; }
  .cronolink:hover { color: #f0899c; }
  .backbtn:hover { color: #f0899c; }
  .readbtn:hover { background: rgba(224,80,110,0.12); border-color: rgba(224,80,110,0.9); box-shadow: 0 0 0 1px rgba(224,80,110,0.4),0 8px 26px rgba(224,80,110,0.16); color: #ffffff; }
  .olderitem:hover { color: #f0899c; padding-left: 8px; }
  .chrono-latest:hover { border-color: rgba(224,80,110,0.75); box-shadow: 0 0 0 1px rgba(224,80,110,0.4),0 18px 56px rgba(224,80,110,0.12); transform: translateY(-2px); }
  .chrono-item:hover { border-color: rgba(224,80,110,0.5); box-shadow: 0 14px 44px rgba(0,0,0,0.45); transform: translateY(-2px); }

  /* Dropdown categoria: apertura su hover (era una sc-if pilotata da onMouseEnter/Leave) */
  .catmenu { display: none; }
  .catwrap:hover .catmenu { display: block; }
</style>
</head>
<body>

<div style="position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 14%, rgba(0,0,0,0) 32%), radial-gradient(120% 90% at 50% -10%, rgba(46,20,26,0.4) 0%, rgba(7,8,10,0) 45%), radial-gradient(140% 120% at 50% 120%, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 55%);"></div>
<canvas id="fx" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>

<div style="position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:52px 28px 88px;">
  <div id="app"></div>
</div>

<script>
(function () {
  "use strict";

  // ===== DATI (mock). `offset` = giorni fa: date e badge sono calcolati rispetto a
  // oggi, così "questa settimana" (<= 7 gg) e "Nuovo" (<= 2 gg) funzionano sempre. =====
  const categories = [
    {
      id: 'chip', name: 'Chip', kicker: 'Semiconduttori',
      sources: [
        { name: 'Reuters', url: '#' },
        { name: 'The Verge', url: '#' },
        { name: 'Bloomberg', url: '#' }
      ],
      articles: [
        { id: 'c1', offset: 1, title: 'TSMC accelera la produzione a 2nm nello stabilimento di Hsinchu', source: 'Reuters', url: '#', summary: 'La fonderia taiwanese anticipa la produzione in volumi del nodo a 2 nanometri, con rese superiori alle attese. I primi lotti sono destinati ai clienti mobile e AI, in un contesto di domanda record per la capacità avanzata.' },
        { id: 'c2', offset: 2, title: 'Nvidia presenta la nuova architettura GPU per il data center', source: 'The Verge', url: '#', summary: 'La nuova generazione promette un salto prestazionale sull’inferenza e un’efficienza energetica migliore per rack. Gli hyperscaler hanno già prenotato gran parte della capacità iniziale.' },
        { id: 'c3', offset: 4, title: 'L’Europa stanzia 4 miliardi per la sovranità sui semiconduttori', source: 'Politico EU', url: '#', summary: 'Il nuovo pacchetto di finanziamenti punta a rafforzare la ricerca e la capacità produttiva europea, riducendo la dipendenza dall’import asiatico.' },
        { id: 'c4', offset: 6, title: 'ASML: ordini record per le macchine litografiche EUV', source: 'Bloomberg', url: '#', summary: 'Il portafoglio ordini raggiunge nuovi massimi, trainato dagli investimenti in capacità avanzata di TSMC, Samsung e Intel.' },
        { id: 'c5', offset: 7, title: 'Intel avvia la produzione di rischio sul nodo 18A', source: 'Reuters', url: '#', summary: 'Il nodo 18A entra nella fase di risk production, un passaggio chiave nel piano di recupero della leadership di processo entro fine anno.' },
        { id: 'c6', offset: 9, title: 'Samsung amplia la capacità HBM per l’AI', source: 'The Verge', url: '#', summary: 'La divisione memory annuncia nuove linee dedicate all’HBM4, in risposta alla domanda esplosiva degli acceleratori per data center.' },
        { id: 'c7', offset: 11, title: 'Arm presenta la nuova generazione di core per data center', source: 'Bloomberg', url: '#', summary: 'I nuovi core promettono un miglioramento a doppia cifra su prestazioni per watt, puntando ai server AI e ai carichi cloud.' },
        { id: 'c8', offset: 14, title: 'Il Giappone incentiva la produzione locale di chip maturi', source: 'Reuters', url: '#', summary: 'Nuovi sussidi per i nodi legacy, considerati strategici per automotive e industria, riducono la dipendenza dalle importazioni.' },
        { id: 'c9', offset: 17, title: 'Micron alza le stime sulla domanda di memoria per AI', source: 'The Verge', url: '#', summary: 'L’azienda rivede al rialzo l’outlook trimestrale, trainata dalla domanda di DRAM e HBM per i cluster di addestramento.' },
        { id: 'c10', offset: 20, title: 'Cresce la corsa al chiplet e al packaging avanzato', source: 'Bloomberg', url: '#', summary: 'Il packaging 2.5D e 3D diventa il nuovo campo di battaglia tra fonderie, mentre la miniaturizzazione classica rallenta.' },
        { id: 'c11', offset: 23, title: 'GlobalFoundries investe sui nodi specializzati', source: 'Reuters', url: '#', summary: 'La fonderia punta su RF, silicio-fotonica e nodi maturi ad alto margine, evitando la corsa ai nanometri più avanzati.' },
        { id: 'c12', offset: 26, title: 'La domanda di silicio per automotive torna a crescere', source: 'The Verge', url: '#', summary: 'Dopo mesi di correzione delle scorte, gli ordini dai produttori auto riprendono, sostenuti dall’elettrificazione.' },
        { id: 'c13', offset: 29, title: 'Nuovi materiali: il diamante sintetico entra nei power chip', source: 'Bloomberg', url: '#', summary: 'La ricerca sui semiconduttori a banda larga apre la strada a dispositivi di potenza più efficienti e resistenti al calore.' }
      ]
    },
    {
      id: 'energia', name: 'Energia', kicker: 'Power & Grid',
      sources: [
        { name: 'IEA', url: '#' }
      ],
      articles: [
        { id: 'e1', offset: 1, title: 'Il fabbisogno energetico dei data center raddoppierà entro il 2030', source: 'IEA', url: '#', summary: 'Secondo le ultime stime, la crescita dei carichi AI porterà il consumo dei data center a livelli paragonabili a quello di intere nazioni, con forti pressioni sulle reti.' },
        { id: 'e2', offset: 4, title: 'Nuovo record di efficienza per i pannelli solari in perovskite', source: 'Nature Energy', url: '#', summary: 'Le celle tandem silicio-perovskite superano una nuova soglia di efficienza in laboratorio, avvicinando la tecnologia alla commercializzazione.' },
        { id: 'e3', offset: 7, title: 'Le big tech puntano sul nucleare di piccola scala (SMR)', source: 'Financial Times', url: '#', summary: 'Nuovi accordi di lungo periodo per alimentare i campus con reattori modulari, nel tentativo di garantire energia stabile e a basse emissioni.' },
        { id: 'e4', offset: 12, title: 'La rete elettrica europea sotto pressione per il carico AI', source: 'Euractiv', url: '#', summary: 'Gli operatori di rete segnalano tempi di connessione in aumento per i nuovi impianti, con code di richieste che rallentano gli sviluppi.' }
      ]
    },
    {
      id: 'datacenter', name: 'Data center', kicker: 'Infrastruttura',
      sources: [
        { name: 'Data Center Dynamics', url: '#' },
        { name: 'Synergy Research', url: '#' },
        { name: 'Tom’s Hardware', url: '#' }
      ],
      articles: [
        { id: 'd1', offset: 1, title: 'Microsoft annuncia tre nuovi campus hyperscale in Europa', source: 'Data Center Dynamics', url: '#', summary: 'Il piano di espansione prevede investimenti multimiliardari e nuove region cloud, con focus su sostenibilità e raffreddamento a liquido.' },
        { id: 'd2', offset: 3, title: 'Il raffreddamento a liquido diventa standard per i cluster AI', source: 'Tom’s Hardware', url: '#', summary: 'L’aumento della densità termica dei rack GPU rende il direct-to-chip la soluzione predefinita nelle nuove costruzioni.' },
        { id: 'd3', offset: 6, title: 'Investimenti in data center oltre i 400 miliardi nel 2026', source: 'Synergy Research', url: '#', summary: 'La spesa in capacità continua a crescere a doppia cifra, trainata dalla domanda di infrastruttura per l’intelligenza artificiale.' },
        { id: 'd4', offset: 10, title: 'Google amplia la capacità in Italia con la region di Milano', source: 'Corriere Innovazione', url: '#', summary: 'Nuove zone di disponibilità per servire il mercato italiano, con impegni su energia rinnovabile e sovranità del dato.' }
      ]
    },
    {
      id: 'supply', name: 'Supply chain', kicker: 'Logistica & Materiali',
      sources: [
        { name: 'DigiTimes', url: '#' },
        { name: 'Reuters', url: '#' }
      ],
      articles: [
        { id: 's1', offset: 2, title: 'Colli di bottiglia sui substrati ABF: tempi di consegna in aumento', source: 'DigiTimes', url: '#', summary: 'La domanda di package avanzati per GPU supera l’offerta di substrati, allungando i lead time e spingendo i prezzi al rialzo.' },
        { id: 's2', offset: 5, title: 'Le terre rare tornano al centro delle tensioni commerciali', source: 'Reuters', url: '#', summary: 'Nuove restrizioni all’export riaccendono i timori sulla disponibilità di materiali critici per l’elettronica e i magneti.' },
        { id: 's3', offset: 9, title: 'Nearshoring: cresce la produzione in Messico e India', source: 'The Economist', url: '#', summary: 'Le aziende diversificano la catena di fornitura per ridurre i rischi geopolitici e avvicinare la produzione ai mercati finali.' },
        { id: 's4', offset: 13, title: 'La carenza di trasformatori rallenta i nuovi impianti', source: 'Bloomberg', url: '#', summary: 'I tempi di consegna dei trasformatori di potenza superano i due anni, frenando la connessione di data center e impianti rinnovabili.' }
      ]
    },
    {
      id: 'cloud', name: 'Cloud', kicker: 'Piattaforme & Servizi',
      sources: [
        { name: 'TechCrunch', url: '#' },
        { name: 'Canalys', url: '#' },
        { name: 'InfoQ', url: '#' }
      ],
      articles: [
        { id: 'k1', offset: 1, title: 'AWS taglia i prezzi dell’inferenza AI del 30%', source: 'TechCrunch', url: '#', summary: 'La riduzione punta a difendere la quota di mercato sui workload AI, in una fase di forte concorrenza sui costi tra hyperscaler.' },
        { id: 'k2', offset: 3, title: 'La spesa cloud globale supera i 100 miliardi a trimestre', source: 'Canalys', url: '#', summary: 'La crescita accelera trainata da AI generativa e migrazione dei carichi enterprise verso il cloud pubblico.' },
        { id: 'k3', offset: 8, title: 'Sovranità del dato: cresce la domanda di cloud europei', source: 'Handelsblatt', url: '#', summary: 'Le normative sulla residenza dei dati spingono le imprese verso provider e region con garanzie di sovranità.' },
        { id: 'k4', offset: 12, title: 'Kubernetes e workload AI: la nuova frontiera dell’orchestrazione', source: 'InfoQ', url: '#', summary: 'Le piattaforme di orchestrazione evolvono per gestire GPU e pipeline di training su larga scala in modo più efficiente.' }
      ]
    }
  ];

  // ===== LOGICA DATE (come nella bozza chiara) =====
  const SOGLIA_NUOVO = 2;      // giorni: badge "Nuovo" (calcolo lato client)
  const SOGLIA_SETTIMANA = 7;  // giorni: rientra negli aggiornamenti "di questa settimana"
  const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
  const dataDa = (offset) => new Date(Date.now() - offset * 86400000);
  const fmt = (offset) => { const d = dataDa(offset); return d.getDate() + ' ' + MESI[d.getMonth()] + ' ' + d.getFullYear(); };
  const isNuovo = (a) => a.offset <= SOGLIA_NUOVO;
  const diSettimana = (a) => a.offset <= SOGLIA_SETTIMANA;
  const ordinatiPerData = (arts) => arts.slice().sort((x, y) => x.offset - y.offset);

  const findCat = (id) => categories.find(c => c.id === id);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // ===== ICONE (SVG inline, dal concept originale) =====
  const ICON = {
    chip: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg>',
    energia: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M13 2 L5 13.5 h6 l-1 8.5 9-12.5 h-6 z"/></svg>',
    datacenter: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="4" width="16" height="5" rx="1.2"/><rect x="4" y="10.5" width="16" height="5" rx="1.2"/><rect x="4" y="17" width="16" height="3" rx="1.2"/></svg>',
    supply: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="7" height="6" rx="1"/><rect x="14.5" y="9" width="7" height="6" rx="1"/><path d="M9.5 12h5"/><path d="M12.5 10.5 14.5 12l-2 1.5"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M6.5 18 A4 4 0 0 1 6 10.1 A5.2 5.2 0 0 1 16 8.5 A3.7 3.7 0 0 1 17.5 18 z"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    doc: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h2a1.5 1.5 0 0 1 1.5 1.5V18a2 2 0 0 1-2 2H17"/><path d="M7.5 8h6M7.5 11.5h6M7.5 15h4"/></svg>',
    clock: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 12a8.8 8.8 0 1 0 2.6-6.2"/><path d="M3.2 4.6V8h3.4"/><path d="M12 7.6V12l3.3 2"/></svg>',
    link: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#41acdf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    arrowLeft: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    arrowLeftSm: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    extLink: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>'
  };

  // Logo placeholder (sostituisce assets/logo-clean.svg mancante)
  const logo = (h) => '<svg viewBox="0 0 82 34" height="' + h + '" width="' + Math.round(h * 82 / 34) + '" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible;">' +
    '<defs><linearGradient id="kvg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0506e"/><stop offset="1" stop-color="#41acdf"/></linearGradient></defs>' +
    '<text x="0" y="26" font-family="Poppins,system-ui,sans-serif" font-weight="700" font-size="28" letter-spacing="-1" fill="url(#kvg)">KVA</text></svg>';

  // ===== STATO =====
  let state = { view: 'hub', cat: null, art: null, solo: false, back: 'hub' };
  const app = document.getElementById('app');

  // ===== RENDER: componenti condivisi =====
  // Voce del box home: titolo + riga "fonte · data" (come nella bozza chiara).
  function hubItem(catId, a) {
    return '<button data-act="article" data-cat="' + catId + '" data-art="' + a.id + '" data-back="hub" class="witem" style="display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(255,255,255,0.07);padding:12px 0;color:#b7babe;font-family:\'Poppins\',sans-serif;cursor:pointer;transition:color .15s ease,padding-left .15s ease;">' +
      '<span style="display:block;color:inherit;font-size:14px;line-height:1.42;">' + esc(a.title) + '</span>' +
      '<span style="display:block;margin-top:4px;color:#7c8894;font-size:11.5px;">' + esc(a.source) + ' · ' + fmt(a.offset) + (isNuovo(a) ? ' <span style="color:#f0899c;font-weight:600;">· Nuovo</span>' : '') + '</span>' +
    '</button>';
  }

  function navCat(c) {
    const sources = (c.sources || []).map(s =>
      '<a href="' + s.url + '" target="_blank" rel="noopener" class="src" style="display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);color:#b7babe;font-family:\'Poppins\',sans-serif;font-size:12.5px;font-weight:400;text-decoration:none;transition:all .15s ease;">' + ICON.link + esc(s.name) + '</a>'
    ).join('');
    return '<div class="catwrap" style="position:relative;">' +
      '<button class="navbtn" style="display:inline-flex;align-items:center;gap:7px;padding:10px 17px;background:none;border:0;border-radius:999px;color:#c9ccd0;cursor:pointer;font-family:\'Poppins\',sans-serif;font-size:14px;font-weight:400;letter-spacing:0.01em;white-space:nowrap;transition:color .15s ease;">' + esc(c.name) + ICON.chevron + '</button>' +
      '<div class="catmenu" style="position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:11px;z-index:40;">' +
        '<div style="width:340px;background:rgba(13,13,16,0.98);border:1px solid rgba(255,255,255,0.11);border-radius:16px;padding:12px;box-shadow:0 28px 72px rgba(0,0,0,0.7);display:flex;flex-direction:column;gap:4px;animation:kvaFade .18s ease both;">' +
          '<button data-act="latest" data-cat="' + c.id + '" class="menu-item" style="display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:background .15s ease;">' +
            '<span style="flex-shrink:0;width:42px;height:42px;border-radius:11px;background:rgba(65,172,223,0.09);border:1px solid rgba(65,172,223,0.28);display:flex;align-items:center;justify-content:center;color:#41acdf;">' + ICON.doc + '</span>' +
            '<span style="display:flex;flex-direction:column;gap:2px;min-width:0;"><span style="font-family:\'Poppins\',sans-serif;font-size:14.5px;font-weight:600;color:#f0f2f4;">Ultima notizia</span><span style="font-family:\'Poppins\',sans-serif;font-size:12px;font-weight:400;color:#8a9099;">L’articolo più recente della categoria</span></span>' +
          '</button>' +
          '<button data-act="chrono" data-cat="' + c.id + '" class="menu-item" style="display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:background .15s ease;">' +
            '<span style="flex-shrink:0;width:42px;height:42px;border-radius:11px;background:rgba(65,172,223,0.09);border:1px solid rgba(65,172,223,0.28);display:flex;align-items:center;justify-content:center;color:#41acdf;">' + ICON.clock + '</span>' +
            '<span style="display:flex;flex-direction:column;gap:2px;min-width:0;"><span style="font-family:\'Poppins\',sans-serif;font-size:14.5px;font-weight:600;color:#f0f2f4;">Cronologia notizie</span><span style="font-family:\'Poppins\',sans-serif;font-size:12px;font-weight:400;color:#8a9099;">Tutte le notizie in ordine di data</span></span>' +

  render();

  // ===== SFONDO GENERATO + EFFETTO CANVAS =====
  // Sostituisce assets/bg.png: matrice di glifi dim generata proceduralmente, usata sia
  // come background CSS (ripetuto in verticale) sia come sorgente per glow/ripple sul canvas.
  function makeBackground() {
    const P = 48, cols = 26, rows = 26, pad = 8;
    const W = P * cols, H = P * rows;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#07080a';
    g.fillRect(0, 0, W, H);
    const tiles = [];
    let seed = 1234567;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    for (let r = 0; r < rows; r++) for (let col = 0; col < cols; col++) {
      if (rnd() > 0.46) continue;
      const x0 = col * P + pad, y0 = r * P + pad, x1 = (col + 1) * P - pad, y1 = (r + 1) * P - pad;
      const w = x1 - x0, h = y1 - y0;
      g.strokeStyle = 'rgba(120,126,134,0.16)';
      g.lineWidth = 1.3;
      g.beginPath(); g.roundRect(x0, y0, w, h, 5); g.stroke();
      g.strokeStyle = 'rgba(150,156,164,0.24)';
      g.lineWidth = 2; g.lineCap = 'round';
      const gx = x0 + w * 0.28, gy = y0 + h * 0.26, gw = w * 0.44, gh = h * 0.48;
      g.beginPath();
      const type = (rnd() * 4) | 0;
      if (type === 0) { g.moveTo(gx, gy + gh); g.lineTo(gx, gy); g.lineTo(gx + gw, gy); }
      else if (type === 1) { g.moveTo(gx, gy); g.lineTo(gx + gw, gy + gh); g.moveTo(gx + gw, gy); g.lineTo(gx, gy + gh); }
      else if (type === 2) { g.moveTo(gx, gy); g.lineTo(gx, gy + gh); g.lineTo(gx + gw, gy + gh); }
      else { g.moveTo(gx, gy + gh * 0.5); g.lineTo(gx + gw, gy + gh * 0.5); g.moveTo(gx + gw * 0.5, gy); g.lineTo(gx + gw * 0.5, gy + gh); }
      g.stroke();
      tiles.push({ x0: x0 - 2, y0: y0 - 2, x1: x1 + 2, y1: y1 + 2 });
    }
    return { canvas: c, tiles: tiles };
  }

  const bgData = makeBackground();
  const bg = bgData.canvas;
  const bgW = bg.width, bgH = bg.height;
  const tiles = bgData.tiles;

  // background CSS ripetuto in verticale, largo quanto il viewport
  document.body.style.backgroundImage = 'url(' + bg.toDataURL() + ')';
  document.body.style.backgroundRepeat = 'repeat-y';
  document.body.style.backgroundPosition = 'top center';
  document.body.style.backgroundSize = '100% auto';

  // copia colorizzata: i tratti grigi dei glifi diventano rosso-LED, il nero resta nero
  const redBg = document.createElement('canvas');
  redBg.width = bgW; redBg.height = bgH;
  (function () {
    const rctx = redBg.getContext('2d');
    rctx.filter = 'brightness(3.4) saturate(0)';
    rctx.drawImage(bg, 0, 0);
    rctx.filter = 'none';
    rctx.globalCompositeOperation = 'multiply';
    rctx.fillStyle = 'rgb(255,62,88)';
    rctx.fillRect(0, 0, redBg.width, redBg.height);
  })();

  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const resize = () => {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  resize();

  const mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999, active: false };
  const drops = [];
  const splashes = [];
  let lastX = 0, lastY = 0, lastSpawn = 0;
  const onMove = (e) => {
    mouse.tx = e.clientX; mouse.ty = e.clientY;
    if (!mouse.active) { mouse.x = e.clientX; mouse.y = e.clientY; }
    mouse.active = true;
    const dd = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    const now = performance.now();
    if (dd > 38 && now - lastSpawn > 100) {
      drops.push({ x: e.clientX, y: e.clientY, t: now });
      if (drops.length > 10) drops.shift();
      lastX = e.clientX; lastY = e.clientY; lastSpawn = now;
    }
  };
  const onLeave = (e) => { if (!e.relatedTarget) mouse.active = false; };
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseout', onLeave);

  const heat = new Map();
  const bgMap = () => {
    const iw = bgW, ih = bgH;
    const s = W / iw;
    return { iw: iw, ih: ih, s: s, tileH: ih * s };
  };

  const glow = (cx, cy) => {
    if (!tiles.length) return;
    const m = bgMap();
    const s = m.s;
    const scroll = window.scrollY || 0;
    const RANGE = 200;
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 150);
    halo.addColorStop(0, 'rgba(210,30,60,0.22)');
    halo.addColorStop(0.55, 'rgba(180,15,45,0.10)');
    halo.addColorStop(1, 'rgba(160,10,40,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(cx - 150, cy - 150, 300, 300);
    const n0 = Math.floor(scroll / m.tileH), n1 = Math.floor((scroll + H) / m.tileH);
    for (let n = n0; n <= n1; n++) {
      const yOff = n * m.tileH - scroll;
      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        const tx = ((t.x0 + t.x1) / 2) * s;
        const ty = yOff + ((t.y0 + t.y1) / 2) * s;
        const dist = Math.hypot(tx - cx, ty - cy);
        const target = dist < RANGE ? Math.pow(1 - dist / RANGE, 1.6) : 0;
        const key = n * 100000 + i;
        const cur = heat.get(key) || 0;
        const nv = target > cur ? cur + (target - cur) * 0.35 : cur * 0.90;
        if (nv < 0.01) { heat.delete(key); continue; }
        heat.set(key, nv);
      }
    }
    for (const [key, v] of heat) {
      const n = Math.floor(key / 100000), i = key % 100000;
      const t = tiles[i];
      if (!t) { heat.delete(key); continue; }
      const yOff = n * m.tileH - scroll;
      const x = t.x0 * s, y = yOff + t.y0 * s;
      const w2 = (t.x1 - t.x0) * s, h2 = (t.y1 - t.y0) * s;
      const pad = 3 * s;
      const r = Math.min(10 * s, w2 * 0.2);
      ctx.fillStyle = 'rgba(210,35,65,' + (0.09 * v).toFixed(3) + ')';
      ctx.beginPath();
      ctx.roundRect(x - pad, y - pad, w2 + pad * 2, h2 + pad * 2, r);
      ctx.fill();
      ctx.globalAlpha = Math.min(1, v);
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(redBg, t.x0, t.y0, t.x1 - t.x0, t.y1 - t.y0, x, y, w2, h2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
  };

  const drawDrop = (cx, cy, rad, zoom, alpha) => {
    const m = bgMap();
    const scroll = window.scrollY || 0;
    const y0 = -(scroll % m.tileH);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.clip();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(zoom, zoom);
    ctx.translate(-cx, -cy);
    for (let y = y0 - m.tileH; y < H + m.tileH; y += m.tileH) ctx.drawImage(bg, 0, y, W, m.tileH);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'destination-in';
    const fade = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    fade.addColorStop(0, 'rgba(255,255,255,1)');
    fade.addColorStop(0.7, 'rgba(255,255,255,0.85)');
    fade.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fade;
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  const drawRing = (cx, cy, r0, r1, zoom, alpha) => {
    if (r1 <= 2) return;
    const m = bgMap();
    const scroll = window.scrollY || 0;
    const y0 = -(scroll % m.tileH);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r1, 0, Math.PI * 2);
    ctx.arc(cx, cy, Math.max(0, r0), 0, Math.PI * 2, true);
    ctx.clip();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(zoom, zoom);
    ctx.translate(-cx, -cy);
    for (let y = y0 - m.tileH; y < H + m.tileH; y += m.tileH) ctx.drawImage(bg, 0, y, W, m.tileH);
    ctx.restore();
  };

  let nextSplash = performance.now() + 1800;
  const loop = () => {
    ctx.clearRect(0, 0, W, H);
    const now = performance.now();

    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      const age = (now - d.t) / 1000;
      if (age > 1.8) { drops.splice(i, 1); continue; }
      const p = age / 1.8;
      const ease = 1 - Math.pow(1 - p, 3);
      const rad = 38 + ease * 165;
      const zoom = 1 + 0.55 * (1 - ease) + 0.05 * Math.sin(age * 18) * (1 - p);
      const alpha = p < 0.12 ? p / 0.12 : (1 - (p - 0.12) / 0.88);
      drawDrop(d.x, d.y, rad, zoom, alpha);
    }

    mouse.x += (mouse.tx - mouse.x) * 0.5;
    mouse.y += (mouse.ty - mouse.y) * 0.5;

    if (mouse.active && now > nextSplash) {
      splashes.push({ x: mouse.tx, y: mouse.ty, t: now });
      if (splashes.length > 4) splashes.shift();
      nextSplash = now + 2400 + Math.random() * 1300;
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const sp = splashes[i];
      const age = (now - sp.t) / 1000;
      if (age > 2.1) { splashes.splice(i, 1); continue; }
      const p = age / 2.1;
      for (let k = 0; k < 3; k++) {
        const rp = p * 1.25 - k * 0.14;
        if (rp <= 0 || rp >= 1) continue;
        const er = 1 - Math.pow(1 - rp, 2.2);
        const rad = 18 + er * 230;
        const width = 30 * (1 - rp) + 10;
        const zoom = 1 + (0.42 - k * 0.11) * (1 - er);
        const alpha = (1 - rp) * (1 - k * 0.25);
        drawRing(sp.x, sp.y, rad - width, rad + width, zoom, alpha);
      }
      if (p < 0.22) {
        const ip = p / 0.22;
        drawDrop(sp.x, sp.y, 26 + ip * 20, 1 + 0.5 * (1 - ip), 1 - ip * 0.4);
      }
    }

    if (mouse.active) {
      const ph = (now % 1300) / 1300;
      const ease = 1 - Math.pow(1 - ph, 3);
      const rad = 34 + ease * 150;
      const zoom = 1 + 0.5 * (1 - ease);
      const alpha = Math.sin(ph * Math.PI);
      drawDrop(mouse.x, mouse.y, rad, zoom, alpha);
    }
    if (mouse.active) glow(mouse.x, mouse.y);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
