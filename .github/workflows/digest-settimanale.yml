# GitHub Action: esegue il Research Digest Agent una volta a settimana.
#
# COSA FA
#   Ogni lunedì mattina (06:00 UTC) esegue la pipeline reale (con Gemini), rigenera
#   i dati del sito (sito/data.json + sito/index.html) e conserva lo stato tra un
#   run e l'altro (dedup + archivio).
#
# PREREQUISITI (una tantum, su GitHub)
#   Settings > Secrets and variables > Actions > New repository secret:
#     - GEMINI_API_KEY   (obbligatorio per la sintesi)
#   Per l'invio email reale (Gmail):
#     - SMTP_USER        (indirizzo@gmail.com)
#     - SMTP_PASS        (App Password a 16 cifre, non la password dell'account)
#   Facoltativi: SMTP_HOST (default smtp.gmail.com), SMTP_PORT (default 587), SMTP_FROM.
#   Se SMTP_USER/SMTP_PASS mancano, le email vengono solo stampate nel log del run.
#
# PERSISTENZA
#   Il dedup ha bisogno di ricordare gli articoli già pubblicati (data/seen.sqlite3)
#   e la cronologia del sito (data/archivio/). Questi file sono in .gitignore per lo
#   sviluppo locale, ma qui vengono ricommittati con `git add -f` così sopravvivono
#   tra i run settimanali. Anche sito/ (data.json + index.html) viene committato per
#   essere pubblicato (vedi "PUBBLICAZIONE").
#
# PUBBLICAZIONE (Render Static Site)
#   Il sito è statico. Creare su Render uno Static Site collegato a questo repo con
#   Publish directory = sito/ e nessun comando di build: Render fa auto-deploy a
#   ogni push, quindi quando questo job ricommitta sito/ il sito si aggiorna da solo.
#   (L'artifact `sito` allegato al run resta comunque scaricabile a mano.)

name: digest-settimanale

on:
  schedule:
    - cron: "0 6 * * 1"   # ogni lunedì alle 06:00 UTC
  workflow_dispatch: {}    # avvio manuale dalla scheda "Actions"

permissions:
  contents: write          # per ricommittare stato + sito

concurrency:
  group: digest-settimanale
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Genera il digest e il sito
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python main.py --config config.yaml

      - name: Salva il sito come artifact
        uses: actions/upload-artifact@v4
        with:
          name: sito
          path: sito/

      - name: Persisti stato e sito nel repo
        run: |
          git config user.name  "dra-bot"
          git config user.email "dra-bot@users.noreply.github.com"
          git add -f data/seen.sqlite3 data/archivio sito out/digest.md || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "chore(run): digest settimanale $(date -u +%F)"
            git push
          fi
