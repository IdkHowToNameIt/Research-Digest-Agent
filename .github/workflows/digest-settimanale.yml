# GitHub Action: esegue il Research Digest Agent una volta a settimana.
#
# COSA FA
#   Ogni lunedì mattina (06:20 UTC) esegue la pipeline reale (sintesi LLM via
#   Groq), rigenera i dati del sito (sito/data.json + sito/index.html) e
#   conserva lo stato tra un run e l'altro (dedup + archivio).
#
# ORARI (tutto in UTC: il cron di GitHub non conosce i fusi né l'ora legale)
#   06:20 UTC  parte il run -> 08:20 in Italia d'estate, 07:20 d'inverno
#   Le email partono subito dopo la pubblicazione del sito, senza attesa fissa.
#   Per tenere gli orari italiani fissi tutto l'anno il cron va spostato di un'ora
#   ai cambi d'ora (fine ottobre / fine marzo).
#   NB: gli orari sono indicativi — GitHub accoda gli scheduled workflow e nelle
#   ore di punta possono partire con ORE di ritardo (il 2026-07-20: 2h48). Non è
#   un guasto, è come funziona lo scheduler: il lunedì mattina UTC è la fascia
#   più congestionata. Vedi anche DECISIONI sez. 15.
#
# PERCHÉ IN DUE FASI
#   Il sito viene pubblicato subito, le email partono dopo: l'email rimanda al
#   sito, quindi prima si mette online la pagina e poi si manda il link. Sono due
#   step sequenziali, quindi l'ordine è garantito comunque.
#   Non c'è più un orario fisso di invio (`--attendi-invio`, rimosso il
#   2026-07-20): con un cron che può slittare di ore, un'ora d'invio "garantita"
#   era un'illusione — e l'attesa teneva occupato il runner fino a ~50 min a run.
#   L'opzione resta disponibile in main.py se un giorno servisse riattivarla.
#
# PREREQUISITI (una tantum, su GitHub)
#   Settings > Secrets and variables > Actions > New repository secret:
#     - GROQ_API_KEY     (obbligatorio per la sintesi; crea su console.groq.com/keys)
#     - DIGEST_RECIPIENTS (obbligatorio: lettori del digest, indirizzi separati da virgola)
#   Per l'invio email reale (Gmail):
#     - SMTP_USER        (indirizzo@gmail.com)
#     - SMTP_PASS        (App Password a 16 cifre, non la password dell'account)
#   Facoltativi: SMTP_HOST (default smtp.gmail.com), SMTP_PORT (default 587), SMTP_FROM,
#   INTERNAL_NOTES_RECIPIENTS (comparto IT: serve solo nei run che producono note interne).
#   Se SMTP_USER/SMTP_PASS mancano, le email vengono solo stampate nel log del run.
#
#   Nella scheda VARIABLES (non Secrets: un URL pubblico non e' un segreto):
#     - HOMEPAGE_URL   URL pubblico del sito, il link che l'email manda ai lettori.
#   Se non la imposti si ricade su sito.homepage_url di config.yaml, che nel repo
#   e' un placeholder: in quel caso il run si ferma subito con un errore, invece di
#   spedire un digest che rimanda a un indirizzo finto.
#
# PERSISTENZA
#   Il dedup ha bisogno di ricordare gli articoli già pubblicati (backend/data/seen.sqlite3)
#   e la cronologia del sito (backend/data/archivio/). Le metriche operative per run
#   (backend/data/metriche/, un JSON per run) alimentano la dashboard di osservabilità e
#   vanno anch'esse conservate per mostrarne l'andamento nel tempo. Questi file sono in
#   .gitignore per lo sviluppo locale, ma qui vengono ricommittati con `git add -f` così
#   sopravvivono tra i run settimanali. Anche sito/ (data.json + index.html) viene committato per
#   essere pubblicato (vedi "PUBBLICAZIONE"): l'host statico serve i file committati,
#   quindi sito/ deve restare nel repo anche se è in .gitignore.
#
# PUBBLICAZIONE (qualunque hosting statico)
#   Il sito è statico e senza build: basta un host che serva la cartella sito/ del
#   repo e ridispieghi a ogni push. Il workflow non dipende da nessun host in
#   particolare — si limita a ricommittare sito/.
#   Render è l'host su cui la configurazione è stata testata (Static Site,
#   Publish directory = sito/, nessun comando di build), ma Netlify e altri sono
#   equivalenti: vedi la sezione "Adottare il repo" del README.
#   ATTENZIONE con GitHub Pages via Action: i push fatti qui usano GITHUB_TOKEN e
#   i push del GITHUB_TOKEN NON innescano altri workflow, quindi un workflow di
#   deploy Pages non partirebbe da solo. Gli host con webhook esterno (Render,
#   Netlify) non hanno questo problema.
#   (L'artifact `sito` allegato al run resta comunque scaricabile a mano.)

name: digest-settimanale

on:
  schedule:
    - cron: "20 6 * * 1"   # ogni lunedì alle 06:20 UTC (08:20 in Italia d'estate)
  workflow_dispatch: {}    # avvio manuale dalla scheda "Actions"

permissions:
  contents: write          # per ricommittare stato + sito

concurrency:
  group: digest-settimanale
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # Tutte alla major piu' recente (2026-07-21): le versioni precedenti giravano
      # su Node 20, deprecato, e il runner le forzava su Node 24 con un avviso a
      # ogni run. Nota non ovvia su upload-artifact: la v5 NON basta, aveva solo
      # un supporto preliminare a Node 24 e di default restava sulla 20 (lo dicono
      # le note di rilascio della v6). Verificato prima di aggiornare che
      # checkout@v7 mantenga `persist-credentials: true` come default: lo step
      # "Persisti stato e sito nel repo" fa `git push` con quelle credenziali.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          # Vite 8 vuole ^20.19 || >=22.12: con "20" si dipenderebbe da quale minor
          # risolve il runner, e Node 20 e' ormai a fine vita. La 22 (LTS) soddisfa
          # sia Vite sia Vitest senza margini di dubbio.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # L'interfaccia e' React+Vite e va COSTRUITA prima di generare il sito: il
      # passo qui sotto copia frontend/dist/ nella publish-dir. Senza questo step
      # il sito verrebbe pubblicato con i soli JSON e senza interfaccia.
      # `npm ci` (non `install`) per installare esattamente il lock file.
      - name: Costruisci il frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # I test del frontend girano qui e non in un workflow separato: se il bundle
      # e' rotto, meglio scoprirlo prima di spendere le chiamate al modello.
      - name: Test del frontend
        working-directory: frontend
        run: npm test

      # Fase 1: digest + sito, senza email. Il digest resta in backend/out/ per la
      # fase 2 (stesso job, stesso runner: il filesystem persiste tra gli step).
      - name: Genera il digest e il sito
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          # Serve anche qui: il controllo anticipato la verifica prima di spendere
          # le chiamate al modello, invece di fallire all'ora di invio.
          HOMEPAGE_URL: ${{ vars.HOMEPAGE_URL }}
        run: python main.py --config config.yaml --fase genera

      - name: Salva il sito come artifact
        uses: actions/upload-artifact@v7
        with:
          name: sito
          path: sito/

      - name: Persisti stato e sito nel repo
        run: |
          git config user.name  "dra-bot"
          git config user.email "dra-bot@users.noreply.github.com"
          git add -f backend/data/seen.sqlite3 backend/data/archivio backend/data/metriche sito backend/out/digest.md || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "chore(run): digest settimanale $(date -u +%F)"
            # Un push secco fallisce se main si e' mosso durante il run: e' successo
            # il 2026-07-20, con un commit di documentazione spinto mentre il job
            # girava. Il digest era gia' generato e si e' perso solo perche' non
            # riusciva a salvarlo. Ci si riallinea e si riprova una volta.
            git push || {
              echo "Push rifiutato: main si e' mosso, riallineo e riprovo."
              git pull --rebase origin main
              git push
            }
          fi

      # Fase 2: solo email, subito dopo che il sito è stato pubblicato e committato.
      # Nessuna attesa: l'ordine sito -> email è garantito dalla sequenza degli step.
      - name: Invia le email
        working-directory: backend
        env:
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          INTERNAL_NOTES_RECIPIENTS: ${{ secrets.INTERNAL_NOTES_RECIPIENTS }}
          HOMEPAGE_URL: ${{ vars.HOMEPAGE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python main.py --config config.yaml --fase email
