# GitHub Action: pubblica SOLO il frontend, senza rifare il digest.
#
# A COSA SERVE
#   Un cambio all'interfaccia (sfondo, stili, componenti React) non ha bisogno di
#   riscraping ne' di chiamate all'LLM: i dati (i JSON in sito/) sono gia' quelli.
#   Questo workflow ricostruisce solo il bundle Vite e lo ricopia in sito/, poi
#   committa e fa push. L'host statico (Render) ridispiega da solo sul push.
#   Cosi' non serve piu' lanciare "digest-settimanale" solo per vedere una
#   modifica di pagina: quello resta per il digest vero (settimanale o manuale).
#
# QUANDO PARTE
#   - ad ogni push su main che tocca frontend/** (le tue modifiche all'interfaccia);
#   - a mano, dalla scheda Actions (workflow_dispatch).
#   NON parte sui push del digest (che toccano sito/ e backend/data, non frontend/),
#   ne' si ri-innesca da solo: il suo commit tocca sito/, non frontend/, e i push
#   fatti col GITHUB_TOKEN non fanno comunque scattare altri workflow.
#
# PERCHE' NON RICOSTRUISCE I DATI
#   I JSON del sito (data.json, tema-*.json, archivio) restano quelli committati
#   dall'ultimo digest: questo workflow NON li tocca. Riscrive solo index.html e
#   assets/ (il bundle). Se un giorno servisse rigenerare anche i dati, quello e'
#   il compito di digest-settimanale, non di questo.

name: pubblica-frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: write

# Gruppo separato dal digest: i due non si annullano a vicenda. La corsa sul push
# (se il digest committa nello stesso momento) e' gestita dal pull-rebase-retry.
concurrency:
  group: pubblica-frontend
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Costruisci e testa il frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Ricopia il bundle in sito/ (i dati restano)
        run: |
          # assets/ ha nomi con hash di contenuto: quelli vecchi vanno rimossi,
          # altrimenti si accumulano nel repo. I JSON dei dati stanno in sito/ (non
          # in assets/) e non vengono toccati.
          rm -rf sito/assets
          cp -R frontend/dist/. sito/

      - name: Committa e pubblica
        run: |
          git config user.name  "dra-bot"
          git config user.email "dra-bot@users.noreply.github.com"
          # sito/ e' in .gitignore (serve solo alla pubblicazione): -f per forzarlo.
          git add -f sito
          if git diff --cached --quiet; then
            echo "Nessuna modifica al bundle: niente da pubblicare."
          else
            git commit -m "chore(frontend): pubblica il bundle $(date -u +%F)"
            git push || {
              echo "Push rifiutato: main si e' mosso, riallineo e riprovo."
              git pull --rebase origin main
              git push
            }
          fi
