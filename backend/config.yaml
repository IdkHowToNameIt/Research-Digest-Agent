# Configurazione del Research Digest Agent — beat "Infrastruttura & Hardware AI".
# Riferimento: Notion sez. 11 (fonti), 13 (troncamento), 15 (schema).

beat: "Infrastruttura & Hardware AI"
beat_slug: "infra-hardware-ai"

# Sintesi finale (~20% del lavoro) via Groq (una chiave, free tier ampio).
# ID modello — verificabili/aggiornabili dalla lista live:
#   curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY" | jq -r '.data[].id'
model: "llama-3.3-70b-versatile"
# Cascata di ripiego se il primario esaurisce quota (429) o viene deprecato
# (400/404/5xx). Su Groq il free tier per modello e' ampio, quindi la cascata e'
# soprattutto una rete di sicurezza. Il passaggio e' "sticky" (un modello
# esaurito non viene ri-provato per ogni articolo). ORDINE: qualita' prima, costo
# come secondo criterio — il primario e' il modello piu' capace (llama-3.3-70b) per
# non rinunciare alla resa della sintesi; i ripieghi restano forti ma via via piu'
# economici (gpt-oss-120b e' capace E piu' economico del 70b), fino all'8b come
# ultima rete solo in emergenza. Tariffe per modello: vedi `prezzi`.
modelli_fallback:
  - "openai/gpt-oss-120b"
  - "openai/gpt-oss-20b"
  - "gemma2-9b-it"
  - "llama-3.1-8b-instant"
db_path: "data/seen.sqlite3"   # memoria per dedup e conteggi run consecutivi
out_dir: "out"                 # output tecnico (il canale reale e' email + sito)
metriche_dir: "data/metriche"  # metriche operative per run (un JSON per run, per la dashboard)

# Listino prezzi per la stima di costo nella dashboard. I valori sono il LISTINO
# UFFICIALE Groq in USD/1M token (input/output), verificabile su groq.com/pricing.
# Sul free tier il costo REALE che paghiamo resta 0, ma con queste tariffe la dashboard
# stima quanto costerebbe lo stesso identico run sull'API a pagamento (i token sono
# gia' contati). La conversione in euro usa `tasso_cambio_usd_eur` qui sotto. Un modello
# assente da questa lista costa 0. Ordine: dal piu' economico al piu' caro (come la cascata).
prezzi:
  "llama-3.1-8b-instant":    {input: 0.05,  output: 0.08}
  "openai/gpt-oss-20b":      {input: 0.075, output: 0.30}
  "gemma2-9b-it":            {input: 0.20,  output: 0.20}   # non piu' sul listino pubblico Groq: valore storico
  "openai/gpt-oss-120b":     {input: 0.15,  output: 0.60}
  "llama-3.3-70b-versatile": {input: 0.59,  output: 0.79}

# Cambio USD -> EUR applicato ai prezzi qui sopra, cosi' la dashboard mostra il costo
# in euro. 1 USD = 0.874 EUR (mid-market, 18 lug 2026). Aggiornare quando serve.
tasso_cambio_usd_eur: 0.874

# Sito web interno (Fase 8): la homepage a cui rimanda l'email di notifica.
sito:
  # URL pubblico del sito: e' il link che l'email settimanale manda ai lettori.
  # Vale qualunque host statico (vedi README). Due modi per impostarlo:
  #   - variabile d'ambiente HOMEPAGE_URL (su GitHub: Settings > Secrets and
  #     variables > Actions > scheda Variables) — ha la precedenza su questo campo
  #     e non richiede di modificare il repo;
  #   - oppure sostituendo il placeholder qui sotto.
  # Se resta il placeholder e HOMEPAGE_URL non c'e', il run si ferma con un errore
  # invece di spedire email che rimandano a un indirizzo finto.
  homepage_url: "https://DA-SOSTITUIRE.example.com"
  out_dir: "../sito"              # cartella dei file statici generati (pubblicata dall'host)
  archivio_dir: "data/archivio"   # storico dei digest pubblici (JSON, per la cronologia)
  badge_giorni: 2                 # soglia "nuovo aggiornamento" (calcolo lato client)

# Email (Fase 7, sez. 17). Nessuna sezione admin (17.3).
# I destinatari NON stanno qui: sono dati personali e cambiano per ogni adozione del
# repo, quindi si leggono da due variabili d'ambiente (secret su GitHub Actions,
# .env in locale), con gli indirizzi separati da virgola:
#   DIGEST_RECIPIENTS           lettori del digest          (obbligatoria)
#   INTERNAL_NOTES_RECIPIENTS   comparto IT, note interne   (serve solo se ci sono note, 17.2)
# Le due liste restano separate: le note interne non vanno mai ai lettori (16.7/17.2).

# Finestra (in settimane) per il confronto fuzzy anti-duplicati (Fase 4, sez. 16.4).
finestra_dedup_settimane: 6
# Soglia overlap parole/entita' (Jaccard) — parametro DA CALIBRARE (sez. 16.4).
soglia_overlap_dedup: 0.7

# --- 12 fonti (Notion sez. 11, selezione finale del 9 luglio 2026) ------------
# Campi per fonte:
#   nome         etichetta leggibile (usata anche come "fonte" nell'articolo)
#   url          feed RSS/Atom
#   tema         sotto-tema primario: chip|data_center|energia|supply_chain|cloud_capacity
#   max          numero massimo di voci lette per run (null = nessun limite)
#   troncamento  limite caratteri estratto: intero (500) oppure null (nessun limite, sez. 13)
#   filtro_rilevanza  true se serve un filtro tematico a monte (solo Google Cloud Blog, sez. 13/16.2)
#
# NB URL: confermati come fonti corrette. Possibile blocco anti-bot da IP cloud
# su alcuni feed (nota gia' presente nel doc, sez. 11) — da monitorare in produzione.
fonti:
  # -- Chip --
  - nome: "NVIDIA Newsroom"
    url: "https://nvidianews.nvidia.com/releases.xml"
    tema: chip
    max: 10
    troncamento: 500
  - nome: "NVIDIA Blog"
    url: "https://blogs.nvidia.com/feed/"
    tema: chip
    max: 10
    troncamento: 500
  - nome: "Tom's Hardware"
    url: "https://www.tomshardware.com/feeds/all" # i feed per-tag (gpus.xml) sono stati dismessi (404): resta solo il feed di sito, filtrato poi per tema
    tema: chip
    max: 10
    troncamento: 500

  # -- Data center --
  - nome: "Meta Engineering"
    url: "https://engineering.fb.com/feed/"
    tema: data_center
    max: 10
    troncamento: 500
  - nome: "Uptime Institute Journal"
    url: "https://journal.uptimeinstitute.com/feed/"
    tema: data_center
    max: 10
    troncamento: 500
  - nome: "Google Cloud — Infrastructure"
    url: "https://cloudblog.withgoogle.com/products/infrastructure/rss/"
    tema: data_center
    max: null            # nessun limite lettura (feed a bassa frequenza)
    troncamento: null    # nessun troncamento (sez. 13, test 9 luglio)

  # -- Energia (fonte unica: gap noto e accettato, sez. 11) --
  - nome: "arXiv (energia x AI)"
    url: "https://export.arxiv.org/api/query?search_query=all:%22data%20center%22%20AND%20all:energy&sortBy=submittedDate&sortOrder=descending&max_results=20"
    tema: energia
    max: null
    troncamento: null    # nessun troncamento (abstract accademico denso, sez. 13)

  # -- Supply chain --
  - nome: "Google News (TSMC/ASML)"
    url: "https://news.google.com/rss/search?q=TSMC%20OR%20ASML%20when:7d&hl=en-US&gl=US&ceid=US:en"
    tema: supply_chain
    max: 30              # feed molto prolifico (>=100/sett.): si legge un tetto ampio
    troncamento: 500
  - nome: "Federal Register — BIS"
    url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=industry-and-security-bureau"
    tema: supply_chain
    max: 15
    troncamento: 500

  # -- Cloud capacity --
  - nome: "Google Cloud Blog"
    url: "https://cloudblog.withgoogle.com/rss/"
    tema: cloud_capacity
    max: 20
    troncamento: null    # nessun limite MA condizionato a filtro rilevanza (sez. 13/16.2)
    filtro_rilevanza: true
  - nome: "Azure Blog"
    url: "https://azure.microsoft.com/en-us/blog/feed/"
    tema: cloud_capacity
    max: 10
    troncamento: 500
  - nome: "AWS News Blog"
    url: "https://aws.amazon.com/blogs/aws/feed/"
    tema: cloud_capacity
    max: 10
    troncamento: 500
