# Configurazione del Research Digest Agent — beat "Infrastruttura & Hardware AI".
# Riferimento: Notion sez. 11 (fonti), 13 (troncamento), 15 (schema).

beat: "Infrastruttura & Hardware AI"
beat_slug: "infra-hardware-ai"

model: "gemini-2.5-flash" # modello per la sola sintesi finale (~20% del lavoro); flash-lite dismesso per i nuovi account (404 NOT_FOUND)
db_path: "data/seen.sqlite3"   # memoria per dedup e conteggi run consecutivi
out_dir: "out"                 # output tecnico (il canale reale e' email + sito)

# Sito web interno (Fase 8): la homepage a cui rimanda l'email di notifica.
sito:
  homepage_url: "https://research-digest-agent.onrender.com"
  out_dir: "../sito"              # cartella dei file HTML generati (in root, per Render)
  archivio_dir: "data/archivio"   # storico dei digest pubblici (JSON, per la cronologia)
  badge_giorni: 2                 # soglia "nuovo aggiornamento" (calcolo lato client)

# Email (Fase 7, sez. 17). Liste destinatari nel repo, nessuna sezione admin (17.3).
email:
  destinatari_digest: ["nicolo.lingua@edu-its.it","alessio.donisi@edu-its.it", "matteo.abis@edu-its.it","tobia.poggio@edu-its.it"]           # lettori del digest
  destinatari_note_interne: ["matteo.abis@edu-its.it"]        # comparto IT (note interne, 17.2)

# Finestra (in settimane) per il confronto fuzzy anti-duplicati (Fase 4, sez. 16.4).
finestra_dedup_settimane: 6
# Soglia overlap parole/entita' (Jaccard) — parametro DA CALIBRARE (sez. 16.4).
soglia_overlap_dedup: 0.7

# --- 12 fonti (Notion sez. 11, selezione finale del 9 luglio 2026) ------------
# Campi per fonte:
#   nome         etichetta leggibile (usata anche come "fonte" nell'articolo)
#   url          feed RSS/Atom
#   tema         sotto-tema primario: chip|data_center|energia|supply_chain|cloud_capacity
#   max          numero massimo di voci lette per run (null = nessun limite)
#   troncamento  limite caratteri estratto: intero (500) oppure null (nessun limite, sez. 13)
#   filtro_rilevanza  true se serve un filtro tematico a monte (solo Google Cloud Blog, sez. 13/16.2)
#
# NB URL: confermati come fonti corrette. Possibile blocco anti-bot da IP cloud
# su alcuni feed (nota gia' presente nel doc, sez. 11) — da monitorare in produzione.
fonti:
  # -- Chip --
  - nome: "NVIDIA Newsroom"
    url: "https://nvidianews.nvidia.com/releases.xml"
    tema: chip
    max: 10
    troncamento: 500
  - nome: "NVIDIA Blog"
    url: "https://blogs.nvidia.com/feed/"
    tema: chip
    max: 10
    troncamento: 500
  - nome: "Tom's Hardware"
    url: "https://www.tomshardware.com/feeds/all" # i feed per-tag (gpus.xml) sono stati dismessi (404): resta solo il feed di sito, filtrato poi per tema
    tema: chip
    max: 10
    troncamento: 500

  # -- Data center --
  - nome: "Meta Engineering"
    url: "https://engineering.fb.com/feed/"
    tema: data_center
    max: 10
    troncamento: 500
  - nome: "Uptime Institute Journal"
    url: "https://journal.uptimeinstitute.com/feed/"
    tema: data_center
    max: 10
    troncamento: 500
  - nome: "Google Cloud — Infrastructure"
    url: "https://cloudblog.withgoogle.com/products/infrastructure/rss/"
    tema: data_center
    max: null            # nessun limite lettura (feed a bassa frequenza)
    troncamento: null    # nessun troncamento (sez. 13, test 9 luglio)

  # -- Energia (fonte unica: gap noto e accettato, sez. 11) --
  - nome: "arXiv (energia x AI)"
    url: "https://export.arxiv.org/api/query?search_query=all:%22data%20center%22%20AND%20all:energy&sortBy=submittedDate&sortOrder=descending&max_results=20"
    tema: energia
    max: null
    troncamento: null    # nessun troncamento (abstract accademico denso, sez. 13)

  # -- Supply chain --
  - nome: "Google News (TSMC/ASML)"
    url: "https://news.google.com/rss/search?q=TSMC%20OR%20ASML%20when:7d&hl=en-US&gl=US&ceid=US:en"
    tema: supply_chain
    max: 30              # feed molto prolifico (>=100/sett.): si legge un tetto ampio
    troncamento: 500
  - nome: "Federal Register — BIS"
    url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=industry-and-security-bureau"
    tema: supply_chain
    max: 15
    troncamento: 500

  # -- Cloud capacity --
  - nome: "Google Cloud Blog"
    url: "https://cloudblog.withgoogle.com/rss/"
    tema: cloud_capacity
    max: 20
    troncamento: null    # nessun limite MA condizionato a filtro rilevanza (sez. 13/16.2)
    filtro_rilevanza: true
  - nome: "Azure Blog"
    url: "https://azure.microsoft.com/en-us/blog/feed/"
    tema: cloud_capacity
    max: 10
    troncamento: 500
  - nome: "AWS News Blog"
    url: "https://aws.amazon.com/blogs/aws/feed/"
    tema: cloud_capacity
    max: 10
    troncamento: 500
